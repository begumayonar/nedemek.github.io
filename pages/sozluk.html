<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ne Diyo' Bu?</title>
    <link rel="stylesheet" href="../styles/arama-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <div class="logo-container">
            <h2><a href="../index.html">Ne Demek?</a></h2>
        </div>

        <div id="arama">
            <div class="arama-container-2">
                <input type="search" class="arama-bari" placeholder="Bir sözcük, kısaltma veya ek arayın...">
                <button type="submit" class="arama-buton">🔍</button>
            </div>
            <ul id="oneriler"></ul>
        </div>
    </header>

    <aside class="yanbar">
        <div class="links-container">
            <a href="">Ana Sayfa</a>
            <a href="">Yeni Sözcük Bildir</a>
            <a href="" id="rastgele-link">Rastgele Sözcük</a>
            <a href="">Tema Değiştir</a>
        </div>
    </aside>

    <main>
    <section class="sozcuk-ust">
        <div id="sozcuk-tur">
            <h1 class="wordTitle"></h1>
            <p class="tur-yazi"></p>
        </div>
        <div id="okunus-kart">
            <p class="okunus-yazi"></p>
        </div>
    </section>

    <aside class="komsu-sutun"></aside>

    <section class="sozcuk-alt">
        <div class="ust-bolum">
            <h2>Anlamı:</h2>
        </div>
        <div class="anlam-karti">
            <ol id="definition"></ol>
        </div>

        <div class="ust-bolum">
            <h3>Kullanımlar</h3>
        </div>
        <div class="anlam-karti">
            <p id="usage"></p>
        </div>

        <div class="ust-bolum">
            <h4>Benzer Sözcükler</h4>
        </div>
        <div class="anlam-karti">
            <p id="benzer"></p>
        </div>
    </section>

    <aside class="turev-sutun" id="turev-liste"></aside>
</main>

    <footer>
        <div class="foot-links">
            <a href="">Bu sözlük nedir?</a>
            <p>|</p>
            <a href="/pages/iletisim.html">Geri Bildirim</a>

        </div>

        <div class="footer-bottom">
            <p>© 2026 Ne Diyo' Bu?. Tüm hakları saklıdır.</p>
        </div>
    </footer>

<script src="../js/sozluk-core.js"></script>
<script>
    (async () => {
        await veriHazir;

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const tur = params.get('tur');
        const veri = idIleBul(id, tur);

        if (!veri) {
            document.querySelector('.wordTitle').textContent = 'Sözcük bulunamadı';
            document.getElementById('definition').textContent = '';
            return;
        }

        document.querySelector('.wordTitle').textContent = veri.sozcuk;
        document.querySelector('.okunus-yazi').textContent = veri.okunus ? `(${veri.okunus})` : '';

const anlamMetni = veri.anlam || '';

if (anlamMetni.includes(",")) {
    const cokluAnlam = anlamMetni
        .slice(0, -1)
        .split(",")
        .map(eleman =>
            eleman.trim()[0].toLocaleUpperCase("tr-TR") +
            eleman.trim().slice(1)
        );

    const definition = document.getElementById("definition");
    cokluAnlam.forEach(eleman => {
        const li = document.createElement("li");
        li.textContent = eleman;
        definition.appendChild(li);
    });
} else {
    document.getElementById('definition').textContent = anlamMetni || 'Henüz eklenmedi.';
}

        document.getElementById('usage').textContent = veri.kullanim || 'Henüz eklenmedi.';

        const turEtiketi = {
            sozcuk: "Sözcük",
            kisaltma: "Kısaltma",
            ek: "Ek",
        };
        document.querySelector(".tur-yazi").textContent = turEtiketi[veri.tur] || "";

        // KOMŞU SÜTUNU
        const komsular = komsulariGetir(veri.id, veri.tur);
        const komsuKutu = document.querySelector('.komsu-sutun');
        komsuKutu.innerHTML = '';

        komsular.forEach(k => {
            if (k.aktif) {
                const div = document.createElement('div');
                div.className = 'orta-vurgu';
                div.textContent = k.sozcuk;
                komsuKutu.appendChild(div);
            } else {
                const a = document.createElement('a');
                a.className = 'komsu-link';
                a.href = `sozluk.html?id=${k.id}&tur=${k.tur}`;
                a.textContent = k.sozcuk;
                komsuKutu.appendChild(a);
            }
        });

        // TÜREV SÜTUNU
        const turevler = turevleriGetir(veri.turev);
        const turevKutu = document.getElementById('turev-liste');
        turevKutu.innerHTML = '';

        turevler.forEach(t => {
            const a = document.createElement('a');
            a.href = `sozluk.html?id=${t.id}&tur=${t.tur}`;
            a.textContent = t.sozcuk;
            turevKutu.appendChild(a);
        });
    })();

    // ARAMA KUTUSU
    const kutu = document.querySelector('.arama-bari');
    const oneriListesi = document.getElementById('oneriler');
    let timer;

    kutu.addEventListener('input', (e) => {
        clearTimeout(timer);
        timer = setTimeout(async () => {
            await veriHazir;
            const q = e.target.value;
            oneriListesi.innerHTML = '';
            if (!q) return;

            onerileriGetir(q).forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `${item.sozcuk}${item.okunus ? ` <span class="okunus">(${item.okunus})</span>` : ''}`;
                li.addEventListener('click', () => {
                    window.location.href = `sozluk.html?id=${item.id}&tur=${item.tur}`;
                });
                oneriListesi.appendChild(li);
            });
        }, 100);
    });

    function aramayiCalistir() {
        const q = kutu.value.trim();
        if (!q) return;
        const sonuclar = onerileriGetir(q, 1);
        if (sonuclar.length > 0) {
            window.location.href = `sozluk.html?id=${sonuclar[0].id}&tur=${sonuclar[0].tur}`;
        }
    }

    kutu.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            aramayiCalistir();
        }
    });

    document.querySelector('.arama-buton').addEventListener('click', (e) => {
        e.preventDefault();
        aramayiCalistir();
    });

    // RASTGELE SÖZCÜK
    document.getElementById("rastgele-link").addEventListener("click", async (e) => {
        e.preventDefault();
        await veriHazir;
        const veri = rastgeleSozcuk();
        window.location.href = `sozluk.html?id=${veri.id}&tur=${veri.tur}`;
    });

    
</script>
</body>

</html>
