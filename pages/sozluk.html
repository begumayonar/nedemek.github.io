<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ne Diyo' Bu?</title>
    <link rel="stylesheet" href="../styles/arama-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <div class="logo-container">
            <h2><a href="../index.html">Ne Diyo' Bu?</a></h2>
        </div>

        <div id="arama">
            <div class="arama-container-2">
                <input type="search" class="arama-bari" placeholder="Bir sözcük, kısaltma veya ek arayın...">
                <button type="submit" class="arama-buton">🔍</button>
            </div>
                            <ul id="oneriler"></ul>
        </div>
    </header>

    <aside>
        <div class="links-container">
            <a href="">Ana Sayfa</a>
            <a href="">Yeni Sözcük Bildir</a>
            <a href="">Rastgele Sözcük</a>
            <a href="">Geri Bildirim</a>
            <a href="">Tema Değiştir</a>
        </div>
    </aside>

    <main>
        <section class="sozlukce">

            <div class="sozcuk-kart">
                <h1 class="wordTitle"></h1>
                <p class="okunus-yazi"></p>
            </div>

            <div class="ust-bolum">
                <h2>Anlamı</h2>
            </div>
            <div class="anlam-karti">
                <ol id="definition"></ol>
            </div>
        </section>

        <section class="kullanimlar">
            <div class="ust-bolum">
                <h2>Kullanımlar</h2>
            </div>
            <div class="anlam-karti">
                <p id="usage"></p>
            </div>
        </section>

        <section class="benzerler">
            <div class="ust-bolum">
                <h2>Benzerler</h2>
            </div>
            <div class="anlam-karti">
                <p id="benzer"></p>
            </div>
        </section>
    </main>

    <footer>
        <div class="foot-links">
            <a href="">Bu sözlük nedir?</a>
            <p>|</p>
            <a href="">İletişim</a>
        </div>

        <hr id="cizgi">

        <p id="foot-yazi"> <b>© 2026 <a href="../index.html">Ne Diyo' Bu?</a>. Tüm hakları saklıdır.</b> </p>
    </footer>

    <script src="../js/sozluk-core.js"></script>
    <script>
        (async () => {
            await veriHazir;

            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const veri = idIleBul(id);

            if (!veri) {
                document.querySelector('.wordTitle').textContent = 'Sözcük bulunamadı';
                document.getElementById('definition').textContent = '';
                return;
            }

            document.querySelector('.wordTitle').textContent = veri.sozcuk;
            document.querySelector('.okunus-yazi').textContent = veri.okunus ? `(${veri.okunus})` : '';
            if (veri.anlam.includes(",")) {
                const cokluAnlam = veri.anlam
                    .slice(0, -1)
                    .split(",")
                    .map(eleman =>
                        eleman.trim()[0].toLocaleUpperCase("tr-TR") +
                        eleman.trim().slice(1)
                    );
                let textAnlam = "";

                cokluAnlam.forEach((eleman, index) => {
                    textAnlam += `${index + 1}. ${eleman}\n`;
                });

                const definition = document.getElementById("definition");

                cokluAnlam.forEach(eleman => {
                    const li = document.createElement("li");
                    li.textContent = eleman;
                    definition.appendChild(li);
                });
            } else {
                document.getElementById('definition').textContent = veri.anlam;
            }
            document.getElementById('usage').textContent = veri.kullanim || 'Henüz eklenmedi.';
            document.getElementById('benzer').textContent = 'Yakında...';
        })();

        const kutu = document.querySelector('.arama-bari');
        const oneriListesi = document.getElementById('oneriler');
        let timer;

        kutu.addEventListener('input', (e) => {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                await veriHazir;
                const q = e.target.value;
                oneriListesi.innerHTML = '';
                if (!q) return;

                onerileriGetir(q).forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `${item.sozcuk}${item.okunus ? ` <span class="okunus">(${item.okunus})</span>` : ''}`;
                    li.addEventListener('click', () => {
                        window.location.href = `sozluk.html?id=${item.id}`;
                    });
                    oneriListesi.appendChild(li);
                });
            }, 100);
        });

        function aramayiCalistir() {
            const q = kutu.value.trim();
            if (!q) return;
            const sonuclar = onerileriGetir(q, 1); // sadece ilk sonuç yeter
            if (sonuclar.length > 0) {
                window.location.href = `sozluk.html?id=${sonuclar[0].id}`;
            }
        }

        kutu.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                aramayiCalistir();
            }
        });

        document.querySelector('.arama-buton').addEventListener('click', (e) => {
            e.preventDefault(); // button type="submit" sayfa yenilemesin diye
            aramayiCalistir();
        });
    </script>
</body>

</html>
