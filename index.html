<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ne Diyo' Bu?</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <h2>Ne Demek?</h2>
    </header>

    <aside>
        <div class="links-container">
            <a href="">Ana Sayfa</a>
            <a href="">Yeni Sözcük Bildir</a>
            <a href="#" id="rastgele-link">Rastgele Sözcük</a>
            <a href="">Tema Değiştir</a>
        </div>
    </aside>

    <main>
        <section id="arama">
            <div class="arama-container-2">
                <input type="search" class="arama-bari" placeholder="Bir sözcük, kısaltma veya ek arayın...">
                <button type="submit" class="arama-buton">🔍</button>
                            <ul id="oneriler"></ul>
            </div>

        <div id="sozcuk-sayisi"><p>Kayıtlı sözcük sayısı: <span id="sayi">...</span></p></div>
        </section>
        <section id="son-aranan">
            <h4>Son arananlar:</h4>
            <a href="" id="son-aranan-link">
                <div id="son-aranan-liste"></div>
            </a>
        </section>
    </main>
    <footer>
        <div class="foot-links">
            <a href="">Bu sözlük nedir?</a>
            <a href="/pages/iletisim.html">Geri Bildirim</a>
        </div>
        <div class="footer-bottom">
            <p>© 2026 Ne Diyo' Bu?. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="js/sozluk-core.js"></script>
<script>
    const kutu = document.querySelector('.arama-bari');
    const oneriListesi = document.getElementById('oneriler');
    const sayiSpan = document.getElementById('sayi');
    let timer;

    veriHazir.then(data => sayiSpan.textContent = data.length);

    kutu.addEventListener('input', (e) => {
        clearTimeout(timer);
        timer = setTimeout(async () => {
            await veriHazir;
            const q = e.target.value;
            oneriListesi.innerHTML = '';
            if (!q) return;

            onerileriGetir(q).forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `${item.sozcuk}${item.okunus ? ` <span class="okunus">(${item.okunus})</span>` : ''}`;
                li.addEventListener('click', () => {
                    window.location.href = `pages/sozluk.html?id=${item.id}`;
                });
                oneriListesi.appendChild(li);
            });
        }, 100);
    });

    function aramayiCalistir() {
    const q = kutu.value.trim();
    if (!q) return;
    const sonuclar = onerileriGetir(q, 1); // sadece şlk sonuç
    if (sonuclar.length > 0) {
        window.location.href = `./pages/sozluk.html?id=${sonuclar[0].id}`;
    }
}

kutu.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        aramayiCalistir();
    }
});

document.querySelector('.arama-buton').addEventListener('click', (e) => {
    e.preventDefault();
    aramayiCalistir();
});

document.getElementById("rastgele-link").addEventListener("click", async (e) => {
    e.preventDefault();
    await veriHazir;
    const veri = rastgeleSozcuk();
    window.location.href = `pages/sozluk.html?id=${veri.id}&tur=${veri.tur}`;
});

(async () => {
    await veriHazir;
    const veriler = rastgeleSozcukler();
    const liste = document.getElementById("son-aranan-liste");
    liste.innerHTML = '';

    veriler.forEach(veri => {
        const link = document.createElement('a');
        link.href = `pages/sozluk.html?id=${veri.id}&tur=${veri.tur}`;
        link.textContent = veri.sozcuk;
        liste.appendChild(link);
    });
})();
</script>
</body>

</html>
